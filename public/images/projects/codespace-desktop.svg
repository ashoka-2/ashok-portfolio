<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <rect width="1600" height="1000" fill="#0C0A14"/>
  <rect x="40" y="30" width="1520" height="940" rx="24" fill="#151222" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="40" y="30" width="1520" height="60" rx="24" fill="#1C182E"/>
  <text x="170" y="65" fill="#A89ECA" font-family="system-ui, sans-serif" font-size="14" font-weight="600">codeSpace Cloud IDE // Kubernetes Microservices Pod</text>

  <!-- Editor Window -->
  <rect x="80" y="120" width="940" height="800" rx="16" fill="#110E1C" stroke="rgba(255,255,255,0.06)"/>
  <text x="120" y="170" fill="#8B5CF6" font-family="monospace" font-size="14">import { KubernetesPod, DockerRuntime } from '@codespace/core';</text>
  <text x="120" y="210" fill="#C4B5FD" font-family="monospace" font-size="14">export async function provisionSandbox(spec) {</text>
  <text x="150" y="240" fill="#E2E8F0" font-family="monospace" font-size="13">const container = await Skaffold.spawn({</text>
  <text x="180" y="270" fill="#9CA3AF" font-family="monospace" font-size="13">image: 'node:22-alpine',</text>
  <text x="180" y="295" fill="#9CA3AF" font-family="monospace" font-size="13">tty: true, memory: '2Gi',</text>
  <text x="180" y="320" fill="#9CA3AF" font-family="monospace" font-size="13">websocketTerminal: true</text>
  <text x="150" y="350" fill="#E2E8F0" font-family="monospace" font-size="13">});</text>
  <text x="150" y="390" fill="#8B5CF6" font-family="monospace" font-size="13">return container.pipeTerminalStream();</text>
  <text x="120" y="420" fill="#C4B5FD" font-family="monospace" font-size="14">}</text>

  <!-- Integrated Terminal -->
  <rect x="120" y="470" width="860" height="410" rx="12" fill="#0A0812" stroke="#8B5CF6" stroke-width="1"/>
  <text x="145" y="505" fill="#8B5CF6" font-family="monospace" font-size="12">root@sandbox-eks-node-04:~$ kubectl get pods -n dev</text>
  <text x="145" y="535" fill="#A7F3D0" font-family="monospace" font-size="12">NAME                     READY   STATUS    RESTARTS   AGE</text>
  <text x="145" y="560" fill="#E2E8F0" font-family="monospace" font-size="12">sandbox-node-89f41       1/1     Running   0          42s</text>
  <text x="145" y="585" fill="#E2E8F0" font-family="monospace" font-size="12">ai-orchestrator-71bc     1/1     Running   0          2m</text>
  <text x="145" y="625" fill="#8B5CF6" font-family="monospace" font-size="12">root@sandbox-eks-node-04:~$ npm run start:dev</text>
  <text x="145" y="655" fill="#C4B5FD" font-family="monospace" font-size="12">[Vite] Server running at http://localhost:5173/ in 184ms</text>

  <!-- Right: Microservices Architecture -->
  <rect x="1050" y="120" width="470" height="800" rx="16" fill="#151222"/>
  <text x="1080" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="700">AWS EKS Cluster Health</text>
  <rect x="1080" y="210" width="410" height="120" rx="14" fill="#1C182E" stroke="#8B5CF6" stroke-width="1"/>
  <text x="1105" y="250" fill="#8B5CF6" font-family="system-ui, sans-serif" font-size="14" font-weight="600">SANDBOX CLUSTER 01</text>
  <text x="1105" y="285" fill="#FFFFFF" font-family="monospace" font-size="22" font-weight="700">14 ACTIVE PODS</text>
</svg>