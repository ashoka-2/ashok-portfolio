      <!-- Card 3 -->
      <g transform="translate(660, 50)">
        <rect x="0" y="0" width="300" height="380" rx="18" fill="#12131c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="16" y="16" width="268" height="220" rx="14" fill="#381822"/>
        <circle cx="150" cy="126" r="50" fill="#f43f5e" opacity="0.5"/>
        <text x="16" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Hyperdrive Overload</text>
        <text x="16" y="294" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="13">CyberPulse · 142 BPM</text>
        <rect x="16" y="318" width="112" height="24" rx="12" fill="rgba(244,63,94,0.15)"/>
        <text x="72" y="334" fill="#fb7185" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">ADRENALINE 96%</text>
