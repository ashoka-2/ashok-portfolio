        <rect x="0" y="0" width="300" height="380" rx="18" fill="#12131c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="16" y="16" width="268" height="220" rx="14" fill="#122a22"/>
        <circle cx="150" cy="126" r="50" fill="#10b981" opacity="0.5"/>
        <text x="16" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Evergreen Ambient</text>
        <text x="16" y="294" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="13">Nature Synthesis · 60 BPM</text>
        <rect x="16" y="318" width="94" height="24" rx="12" fill="rgba(16,185,129,0.15)"/>
        <text x="63" y="334" fill="#34d399" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">CALM 99%</text>
      </g>
    </g>
  </g>

  <!-- Bottom Player Bar -->
  <rect x="0" y="910" width="1600" height="90" fill="#0d0e14" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="32" y="925" width="60" height="60" rx="12" fill="#3b1d60"/>
  <text x="110" y="950" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Midnight Echoes in Tokyo</text>
  <text x="110" y="970" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="12">Komorebi Dreams · Serene Mode</text>

  <!-- Player Controls -->
  <circle cx="800" cy="955" r="22" fill="#8b5cf6"/>
  <polygon points="796,947 808,955 796,963" fill="#ffffff"/>
  <!-- Progress Bar -->
  <line x1="600" y1="930" x2="1000" y2="930" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-linecap="round"/>
  <line x1="600" y1="930" x2="780" y2="930" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round"/>
  <text x="560" y="934" fill="#6e6e72" font-family="'DM Mono', monospace" font-size="10">2:14</text>
  <text x="1016" y="934" fill="#6e6e72" font-family="'DM Mono', monospace" font-size="10">4:38</text>
</svg>