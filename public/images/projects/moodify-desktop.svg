        <text x="16" y="294" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="13">Synthwave AI · 104 BPM</text>
        <rect x="16" y="318" width="104" height="24" rx="12" fill="rgba(56,189,248,0.15)"/>
        <text x="68" y="334" fill="#38bdf8" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">CREATIVE 88%</text>
