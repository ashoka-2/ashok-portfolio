      <g transform="translate(680, 200)" fill="url(#mf-accent)">
        <rect x="0" y="-80" width="8" height="100" rx="4"/>
        <rect x="18" y="-120" width="8" height="140" rx="4"/>
        <rect x="36" y="-140" width="8" height="160" rx="4"/>
        <rect x="54" y="-100" width="8" height="120" rx="4"/>
        <rect x="72" y="-160" width="8" height="180" rx="4"/>
        <rect x="90" y="-180" width="8" height="200" rx="4"/>
        <rect x="108" y="-130" width="8" height="150" rx="4"/>
        <rect x="126" y="-90" width="8" height="110" rx="4"/>
        <rect x="144" y="-150" width="8" height="170" rx="4"/>
        <rect x="162" y="-190" width="8" height="210" rx="4"/>
        <rect x="180" y="-140" width="8" height="160" rx="4"/>
        <rect x="198" y="-110" width="8" height="130" rx="4"/>
        <rect x="216" y="-170" width="8" height="190" rx="4"/>
        <rect x="234" y="-130" width="8" height="150" rx="4"/>
        <rect x="252" y="-90" width="8" height="110" rx="4"/>
        <rect x="270" y="-150" width="8" height="170" rx="4"/>
        <rect x="288" y="-170" width="8" height="190" rx="4"/>
        <rect x="306" y="-120" width="8" height="140" rx="4"/>
        <rect x="324" y="-80" width="8" height="100" rx="4"/>
        <rect x="342" y="-140" width="8" height="160" rx="4"/>
        <rect x="360" y="-160" width="8" height="180" rx="4"/>
        <rect x="378" y="-110" width="8" height="130" rx="4"/>
      </g>
    </g>

    <!-- Recommended Emotion Channels -->
    <g transform="translate(20, 430)">
      <text x="0" y="24" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Mood Resonance Recommendations</text>
      
      <!-- Card 1 -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="300" height="380" rx="18" fill="#12131c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="16" y="16" width="268" height="220" rx="14" fill="#241b38"/>
        <circle cx="150" cy="126" r="50" fill="#8b5cf6" opacity="0.5"/>
        <text x="16" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Subconscious Solitude</text>
        <text x="16" y="294" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="13">Cortex Drift · 68 BPM</text>
        <rect x="16" y="318" width="96" height="24" rx="12" fill="rgba(139,92,246,0.15)"/>
        <text x="64" y="334" fill="#a78bfa" font-family="'DM Mono', monospace" font-size="10" text-anchor="middle">FOCUS 94%</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(330, 50)">
        <rect x="0" y="0" width="300" height="380" rx="18" fill="#12131c" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="16" y="16" width="268" height="220" rx="14" fill="#152838"/>
        <circle cx="150" cy="126" r="50" fill="#38bdf8" opacity="0.5"/>
