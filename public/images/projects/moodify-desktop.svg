      <polygon points="98,226 114,234 98,242" fill="#ffffff"/>
      <text x="126" y="239" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Play Now</text>

      <rect x="224" y="210" width="170" height="48" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="309" y="239" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Tune Intensity 🎛️</text>

