<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="mf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a10"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="mf-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b1d60"/>
      <stop offset="50%" stop-color="#191938"/>
      <stop offset="100%" stop-color="#0d1024"/>
    </linearGradient>
    <linearGradient id="mf-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#mf-bg)"/>

  <!-- Left Sidebar -->
  <rect x="0" y="0" width="240" height="910" fill="#0c0c14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="48" cy="46" r="16" fill="#8b5cf6"/>
  <polygon points="44,38 56,46 44,54" fill="#ffffff"/>
  <text x="76" y="52" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Moodify</text>

  <g font-family="system-ui, sans-serif" font-size="13" font-weight="500">
    <rect x="16" y="96" width="208" height="38" rx="10" fill="rgba(139,92,246,0.15)"/>
    <text x="48" y="120" fill="#a78bfa" font-weight="600">Emotional Radar</text>
    <text x="48" y="164" fill="#a0a09e">Discover Stream</text>
    <text x="48" y="208" fill="#a0a09e">BPM Synchronizer</text>
    <text x="48" y="252" fill="#a0a09e">Bio-Feedback</text>
    <text x="48" y="296" fill="#a0a09e">Saved Playlists</text>
  </g>

  <!-- Mood Palette Selector in Sidebar -->
  <text x="24" y="360" fill="#6e6e72" font-family="'DM Mono', monospace" font-size="11">ACTIVE MOOD SPECTRUM</text>
  <g transform="translate(20, 380)">
    <rect x="0" y="0" width="200" height="30" rx="15" fill="rgba(139,92,246,0.2)"/>
    <text x="18" y="20" fill="#c4b5fd" font-size="12">🟣 Deep Focus (72%)</text>
    <rect x="0" y="40" width="200" height="30" rx="15" fill="rgba(56,189,248,0.15)"/>
    <text x="18" y="60" fill="#7dd3fc" font-size="12">🔵 Chillwave (18%)</text>
    <rect x="0" y="80" width="200" height="30" rx="15" fill="rgba(244,63,94,0.15)"/>
    <text x="18" y="100" fill="#fda4af" font-size="12">🔴 High Adrenaline (10%)</text>
  </g>

  <!-- Main Area -->
  <g transform="translate(260, 0)">
    <!-- Top Header -->
    <rect x="0" y="0" width="1340" height="64" fill="transparent"/>
    <text x="20" y="42" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="20" font-weight="700">AI Adaptive Soundscape</text>
    <rect x="1140" y="18" width="160" height="32" rx="16" fill="rgba(255,255,255,0.06)"/>
    <text x="1220" y="39" fill="#a0a09e" font-family="'DM Mono', monospace" font-size="11" text-anchor="middle">HEADPHONES: CONNECTED</text>

    <!-- Big Mood Hero Banner -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="1300" height="320" rx="24" fill="url(#mf-hero)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      
      <!-- Ambient Glow Orb -->
      <circle cx="950" cy="160" r="140" fill="#8b5cf6" opacity="0.35" filter="blur(60px)"/>
      <circle cx="1100" cy="140" r="120" fill="#38bdf8" opacity="0.25" filter="blur(50px)"/>

      <text x="48" y="70" fill="#a78bfa" font-family="'DM Mono', monospace" font-size="12">AI SENTIMENT DETECTOR: SERENE &amp; CONTEMPLATIVE</text>
      <text x="48" y="128" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">Midnight Echoes in Tokyo</text>
      <text x="48" y="168" fill="#d8b4fe" font-family="system-ui, sans-serif" font-size="18">Komorebi Dreams feat. Neural Orchestra · 82 BPM · Key of D Minor</text>

      <!-- Action Buttons -->
