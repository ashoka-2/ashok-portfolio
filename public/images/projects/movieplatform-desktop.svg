<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="mp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080d"/>
      <stop offset="100%" stop-color="#030406"/>
    </linearGradient>
    <linearGradient id="mp-hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f192b"/>
      <stop offset="40%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#mp-bg)"/>

  <!-- Top Glass Header -->
  <rect x="0" y="0" width="1600" height="74" fill="rgba(10,12,18,0.85)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="56" cy="37" r="18" fill="#e50914"/>
  <polygon points="52,29 64,37 52,45" fill="#ffffff"/>
  <text x="88" y="44" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1">CINEVERSE</text>

  <g font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#a0a09e">
    <text x="280" y="44" fill="#f9f9f7">Home</text>
    <text x="360" y="44">Movies</text>
    <text x="445" y="44">Series</text>
    <text x="525" y="44">Originals</text>
    <text x="625" y="44">4K HDR Cinema</text>
  </g>

  <!-- Search and Profile Pill -->
  <rect x="1340" y="20" width="200" height="36" rx="18" fill="rgba(255,255,255,0.08)"/>
  <text x="1364" y="43" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="13">🔍 Search titles...</text>

  <!-- Hero Featured Cinema Banner -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="1480" height="460" rx="28" fill="url(#mp-hero)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Cinematic Lighting Overlay -->
    <circle cx="1180" cy="220" r="220" fill="#3566ef" opacity="0.25" filter="blur(80px)"/>
    <circle cx="1320" cy="140" r="180" fill="#06b6d4" opacity="0.2" filter="blur(70px)"/>

    <!-- Film Info -->
    <g transform="translate(64, 80)">
      <rect x="0" y="0" width="140" height="26" rx="13" fill="rgba(229,9,20,0.2)" stroke="rgba(229,9,20,0.4)" stroke-width="1"/>
      <text x="70" y="17" fill="#f87171" font-family="'DM Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">★ 9.4 CRITICS CHOICE</text>
      
      <text x="0" y="90" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-0.04em">CHRONOS: BEYOND EARTH</text>
      
      <g transform="translate(0, 126)" font-family="'DM Mono', monospace" font-size="12" fill="#a0a09e">
        <text x="0" y="0">2026</text>
        <text x="50" y="0">·</text>
        <text x="64" y="0">2h 48m</text>
        <text x="130" y="0">·</text>
        <text x="144" y="0">ULTRA HD 4K</text>
        <text x="250" y="0">·</text>
        <text x="264" y="0">DOLBY ATMOS</text>
        <text x="370" y="0">·</text>
        <text x="384" y="0">IMAX ENHANCED</text>
      </g>

      <text x="0" y="180" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16" line-height="1.6" max-width="640">
        When an unmapped singularity appears in the orbit of Saturn, an elite deep-space reconnaissance team
        embarks on humanity's final journey across the event horizon to unlock the code of human origin.
      </text>

      <!-- Buttons -->
      <g transform="translate(0, 240)">
        <rect x="0" y="0" width="190" height="54" rx="27" fill="#f9f9f7"/>
        <polygon points="48,20 64,27 48,34" fill="#000000"/>
        <text x="110" y="33" fill="#000000" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">Play Movie</text>

        <rect x="210" y="0" width="190" height="54" rx="27" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
        <text x="305" y="33" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">+ Add to Watchlist</text>
      </g>
    </g>

    <!-- Simulated Player Preview Frame Right -->
    <g transform="translate(940, 50)">
      <rect x="0" y="0" width="480" height="360" rx="20" fill="#020305" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <circle cx="240" cy="180" r="38" fill="rgba(255,255,255,0.2)"/>
      <polygon points="234,166 254,180 234,194" fill="#ffffff"/>
      <!-- Scrub Bar -->
      <line x1="30" y1="330" x2="450" y2="330" stroke="rgba(255,255,255,0.2)" stroke-width="4" stroke-linecap="round"/>
      <line x1="30" y1="330" x2="280" y2="330" stroke="#e50914" stroke-width="4" stroke-linecap="round"/>
      <circle cx="280" cy="330" r="6" fill="#e50914"/>
    </g>
  </g>

  <!-- Horizontal Film Rails -->
  <g transform="translate(60, 590)">
    <text x="0" y="24" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Trending Now on Cineverse</text>

    <!-- Film Card 1 -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="224" height="330" rx="16" fill="#131722" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="12" y="12" width="200" height="230" rx="12" fill="#1b253b"/>
      <circle cx="112" cy="120" r="40" fill="#3566ef" opacity="0.4"/>
      <text x="12" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Oppenheimer</text>
      <text x="12" y="290" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="12">Biographical Thriller · 4K</text>
    </g>

    <!-- Film Card 2 -->
    <g transform="translate(252, 44)">
      <rect x="0" y="0" width="224" height="330" rx="16" fill="#131722" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="12" y="12" width="200" height="230" rx="12" fill="#2d1b3b"/>
      <circle cx="112" cy="120" r="40" fill="#a855f7" opacity="0.4"/>
      <text x="12" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Blade Runner 2049</text>
      <text x="12" y="290" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="12">Sci-Fi Neo-Noir · HDR</text>
    </g>

    <!-- Film Card 3 -->
    <g transform="translate(504, 44)">
      <rect x="0" y="0" width="224" height="330" rx="16" fill="#131722" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="12" y="12" width="200" height="230" rx="12" fill="#3b1b1b"/>
      <circle cx="112" cy="120" r="40" fill="#ef4444" opacity="0.4"/>
      <text x="12" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Dune: Part Two</text>
      <text x="12" y="290" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="12">Epic Space Opera · IMAX</text>
    </g>

    <!-- Film Card 4 -->
    <g transform="translate(756, 44)">
      <rect x="0" y="0" width="224" height="330" rx="16" fill="#131722" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="12" y="12" width="200" height="230" rx="12" fill="#1b3b2d"/>
      <circle cx="112" cy="120" r="40" fill="#10b981" opacity="0.4"/>
      <text x="12" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Interstellar</text>
      <text x="12" y="290" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="12">Sci-Fi Adventure · 4K</text>
    </g>

    <!-- Film Card 5 -->
    <g transform="translate(1008, 44)">
      <rect x="0" y="0" width="224" height="330" rx="16" fill="#131722" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="12" y="12" width="200" height="230" rx="12" fill="#3b331b"/>
      <circle cx="112" cy="120" r="40" fill="#f59e0b" opacity="0.4"/>
      <text x="12" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">The Dark Knight</text>
      <text x="12" y="290" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="12">Action Thriller · HDR</text>
    </g>

    <!-- Film Card 6 -->
    <g transform="translate(1260, 44)">
      <rect x="0" y="0" width="220" height="330" rx="16" fill="#131722" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <rect x="12" y="12" width="196" height="230" rx="12" fill="#1b1c2b"/>
      <circle cx="110" cy="120" r="40" fill="#6366f1" opacity="0.4"/>
      <text x="12" y="268" fill="#f9f9f7" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Inception</text>
      <text x="12" y="290" fill="#a0a09e" font-family="system-ui, sans-serif" font-size="12">Sci-Fi Action · 4K</text>
    </g>
  </g>
</svg>