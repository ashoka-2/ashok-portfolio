<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1420"/>
      <stop offset="100%" stop-color="#080B10"/>
    </linearGradient>
  </defs>

  <rect width="600" height="1100" rx="44" fill="url(#bgPM)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Phone Notch/Pill -->
  <rect x="220" y="24" width="160" height="30" rx="15" fill="#000000"/>
  <circle cx="340" cy="39" r="5" fill="#1C2536"/>

  <!-- Header -->
  <text x="50" y="110" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="24" font-weight="700">Parsu Mobile AI</text>
  <rect x="440" y="90" width="110" height="30" rx="15" fill="#20B8CD" fill-opacity="0.15" stroke="#20B8CD" stroke-width="1"/>
  <text x="455" y="110" fill="#20B8CD" font-family="system-ui, sans-serif" font-size="11" font-weight="700">● JARVIS LIVE</text>

  <!-- Voice Agent Card -->
  <rect x="40" y="150" width="520" height="220" rx="24" fill="#161D2B" stroke="#20B8CD" stroke-width="1.5"/>
  <text x="70" y="195" fill="#8E99A8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">FULL-DUPLEX VOICE AGENT</text>
  <text x="70" y="235" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="20" font-weight="600">"Broadcasting update to Instagram..."</text>

  <!-- Audio Waveform -->
  <g transform="translate(70, 270)">
    <rect x="0" y="20" width="8" height="40" rx="4" fill="#20B8CD"/>
    <rect x="18" y="10" width="8" height="60" rx="4" fill="#20B8CD"/>
    <rect x="36" y="5" width="8" height="70" rx="4" fill="#3566EF"/>
    <rect x="54" y="25" width="8" height="30" rx="4" fill="#20B8CD"/>
    <rect x="72" y="8" width="8" height="64" rx="4" fill="#20B8CD"/>
    <rect x="90" y="18" width="8" height="44" rx="4" fill="#3566EF"/>
    <rect x="108" y="28" width="8" height="24" rx="4" fill="#20B8CD"/>
  </g>

  <!-- 1-Click Publish Grid -->
  <text x="50" y="420" fill="#8E99A8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">1-CLICK SOCIAL BROADCAST</text>

  <rect x="40" y="445" width="250" height="110" rx="18" fill="#161D2B" stroke="rgba(255,255,255,0.06)"/>
  <text x="65" y="485" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Instagram</text>
  <text x="65" y="510" fill="#20B8CD" font-family="system-ui, sans-serif" font-size="12">Synced &amp; Ready</text>
  <rect x="65" y="525" width="80" height="18" rx="9" fill="#20B8CD" fill-opacity="0.2"/>
  <text x="75" y="538" fill="#20B8CD" font-family="system-ui, sans-serif" font-size="10">Auto-Post</text>

  <rect x="310" y="445" width="250" height="110" rx="18" fill="#161D2B" stroke="rgba(255,255,255,0.06)"/>
  <text x="335" y="485" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">YouTube</text>
  <text x="335" y="510" fill="#8AABF8" font-family="system-ui, sans-serif" font-size="12">Channel Connected</text>

  <rect x="40" y="575" width="250" height="110" rx="18" fill="#161D2B" stroke="rgba(255,255,255,0.06)"/>
  <text x="65" y="615" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">X / Twitter</text>
  <text x="65" y="640" fill="#20B8CD" font-family="system-ui, sans-serif" font-size="12">Thread Ready</text>

  <rect x="310" y="575" width="250" height="110" rx="18" fill="#161D2B" stroke="rgba(255,255,255,0.06)"/>
  <text x="335" y="615" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">LinkedIn</text>
  <text x="335" y="640" fill="#8AABF8" font-family="system-ui, sans-serif" font-size="12">Network Sync</text>

  <!-- Feed/Activity Card -->
  <rect x="40" y="715" width="520" height="240" rx="20" fill="#141924" stroke="rgba(255,255,255,0.08)"/>
  <text x="65" y="755" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="600">Recent Autonomous Agent Activity</text>
  <text x="65" y="790" fill="#8E99A8" font-family="system-ui, sans-serif" font-size="13">Summarized 14 emails from Google Workspace</text>
  <text x="65" y="825" fill="#8E99A8" font-family="system-ui, sans-serif" font-size="13">Grounded research query on DeepSeek R1 architecture</text>
  <text x="65" y="860" fill="#8E99A8" font-family="system-ui, sans-serif" font-size="13">Generated video caption for YouTube community tab</text>

  <!-- Bottom Floating Pill Composer -->
  <rect x="40" y="990" width="520" height="66" rx="33" fill="#1E2638" stroke="#20B8CD" stroke-width="1.5"/>
  <text x="80" y="1031" fill="#8E99A8" font-family="system-ui, sans-serif" font-size="15">Tap to speak or prompt Parsu...</text>
  <circle cx="510" cy="1023" r="22" fill="#20B8CD"/>
</svg>